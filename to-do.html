<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To-Do List Design</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .todo-container {
        width: 100%;
      }
      .task {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }
      .task.completed span {
        text-decoration: line-through;
        color: #888;
      }
      .actions {
        font-size: 12px;
        color: #007bff;
      }
      .actions span {
        margin-left: 8px;
        cursor: pointer;
      }
      .add-task {
        text-align: center;
        margin: 15px 0px;
        color: #28a745;
        font-weight: bold;
        cursor: pointer;
      }
      .custom {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        padding: 20px;
        width: 350px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="custom">
      <h2>To-Do List</h2>
      <div class="add-task">+ Add new task</div>
      <div class="todo-container"></div>
    </div>
    <script src="./to-do.js"></script>
  </body>
</html>
